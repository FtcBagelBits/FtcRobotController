apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // build.common.gradle pins compileSdkVersion 30, but Panels' androidx dependencies refuse
    // to be consumed below 34. Overridden here for TeamCode only so the upstream SDK files stay
    // untouched. This only changes which APIs are visible at compile time - minSdk (24) and
    // targetSdk (28) are unchanged, so on-robot behavior is the same.
    compileSdk 36

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    // Panels is not on Maven Central; it is published to bylazar's own repo.
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation project(':FtcRobotController')

    // Pedro Pathing - path following / odometry. Resolved from mavenCentral(),
    // which build.dependencies.gradle already declares.
    implementation 'com.pedropathing:ftc:2.1.2'

    // Panels - on-robot dashboard used to tune Pedro and view telemetry/field position.
    // pedropathing:telemetry is the adapter that lets Pedro draw to Panels.
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation 'com.bylazar:fullpanels:1.0.12'
}
